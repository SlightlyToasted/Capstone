{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Kanban Board</title>
	<link href="{% static 'mythic/kanban1.css' %}" rel="stylesheet">
<script src="{% static 'mythic/kanban.js' %}" defer></script>
</head>
<body>
	<div class="kanban">
		 <div class="kanban-stack">
			<div class="kanban-stack-title">Not Started</div>
			<div contenteditable class="kanban-item">
				<div contenteditable class="kanban-item-input">Wash the dishes</div>
				<div class="kanban-dropzone"></div>
			</div>
			<button class="kanban-add-item" type="button">+ Add</button>
		</div> 
	</div>
	<script src="js/main.js" type="module"></script>
</body>
</html>
